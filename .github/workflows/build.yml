name: Quality Gate - Build & Mutation Testing

on:
  push:
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout repository
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Java
      # ----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ----------------------------
      # 3. Build & run normal tests
      # ----------------------------
      - name: Build project & run tests
        run: mvn -B -q clean test

      # ----------------------------
      # 4. Run PIT Mutation Testing (core module)
      # ----------------------------

      - name: Run PIT Mutation Testing (core module only)
        run: mvn clean install -DskipTests && mvn -pl core org.pitest:pitest-maven:mutationCoverage


      # ----------------------------
      # 5. Extract mutation score
      # ----------------------------
      - name: Extract mutation score
        id: pit
        run: |
          REPORT=$(find core -type f -path "*/pit-reports/*/summary.xml" | head -n 1)

          if [ -z "$REPORT" ]; then
            echo "No PIT summary.xml found. Setting score to 0."
            CURR=0
          else
            CURR=$(grep -oPm1 "(?<=<score>)[^<]+" "$REPORT")
          fi

          echo "current_score=$CURR" >> "$GITHUB_OUTPUT"
          echo "Current mutation score: $CURR %"

      # ----------------------------
      # 6. Retrieve previous score
      # ----------------------------
      - name: Retrieve previous mutation score
        id: old
        run: |
          if [ -f .github/mutation/last_score.txt ]; then
            PREV=$(cat .github/mutation/last_score.txt)
          else
            PREV=0
          fi

          echo "previous_score=$PREV" >> "$GITHUB_OUTPUT"
          echo " Previous mutation score: $PREV %"

      # ----------------------------
      # 7. Compare scores + threshold enforcement
      # ----------------------------
      - name: Compare mutation scores
        id: comparison
        run: |
          CUR=${{ steps.pit.outputs.current_score }}
          PREV=${{ steps.old.outputs.previous_score }}
          MIN_THRESHOLD=60

          echo " Comparing mutation scores..."
          echo "  - Current:  $CUR %"
          echo "  - Previous: $PREV %"
          echo "  - Threshold: $MIN_THRESHOLD %"

          # Fail if below threshold
          if [ "$CUR" -lt "$MIN_THRESHOLD" ]; then
            echo " Score below required threshold ($CUR < $MIN_THRESHOLD)"
            exit 1
          fi

          # Fail if score regressed
          if [ "$CUR" -lt "$PREV" ]; then
            echo " Mutation score regressed ($CUR < $PREV)"
            exit 1
          fi

          echo " Mutation score OK."

      # ----------------------------
      # 8. Save new score
      # ----------------------------
      - name: Save updated mutation score
        if: success()
        run: |
          mkdir -p .github/mutation
          echo "${{ steps.pit.outputs.current_score }}" > .github/mutation/last_score.txt
          echo " Saved updated mutation score."

      # ----------------------------
      # 9. Rickroll if failure
      # (needs .github/actions/rickroll/action.yml)
      # ----------------------------
      - name: Rickroll (for fun)
        if: failure()
        uses: ./.github/actions/rickroll

